name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: pokemon-backend

      - name: ESLint
        run: npm run eslint-check

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
        env:
          CI: true

      - name: Build backend
        run: npm run build
        working-directory: pokemon-backend
